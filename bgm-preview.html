<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGM 预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  h1 { font-size: 24px; margin-bottom: 8px; color: #e0e0e0; }
  .subtitle { font-size: 14px; color: #888; margin-bottom: 40px; }
  .track { background: #16213e; border-radius: 16px; padding: 24px 28px; width: 100%; max-width: 520px; margin-bottom: 20px; cursor: pointer; transition: background 0.2s, transform 0.1s; }
  .track:hover { background: #1a2a50; transform: scale(1.01); }
  .track-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .track-desc { font-size: 13px; color: #888; margin-bottom: 16px; }
  .ctrl { display: flex; align-items: center; gap: 12px; }
  .play-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #e0e0e0; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0; }
  .play-btn:hover { background: #fff; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 28px; }
  .bar { width: 4px; background: #6c9fff; border-radius: 2px; animation: none; }
  .playing .bar { animation: bounce 0.6s infinite ease-in-out alternate; }
  .playing .play-btn { background: #6c9fff; }
  @keyframes bounce { from { height: 6px; } to { height: 28px; } }
  .bar:nth-child(2) { animation-delay: 0.1s; }
  .bar:nth-child(3) { animation-delay: 0.2s; }
  .bar:nth-child(4) { animation-delay: 0.3s; }
  .bar:nth-child(5) { animation-delay: 0.4s; }
  footer { margin-top: 40px; font-size: 12px; color: #555; text-align: center; }
</style>
</head>
<body>
<h1>🎵 BGM 预览</h1>
<p class="subtitle">点击播放，松松愉快速度快的背景音乐</p>

<div class="track" id="t1" onclick="toggle(1)">
  <div class="track-title">🌿 精灵小镇</div>
  <div class="track-desc">轻快俏皮 · 144 BPM · 小提琴 + 合成器</div>
  <div class="ctrl">
    <button class="play-btn" id="pb1">▶</button>
    <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
  </div>
</div>

<div class="track" id="t2" onclick="toggle(2)">
  <div class="track-title">☀️ 阳光咖啡馆</div>
  <div class="track-desc">温暖轻快 · 120 BPM · 钢琴 + 吉他</div>
  <div class="ctrl">
    <button class="play-btn" id="pb2">▶</button>
    <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
  </div>
</div>

<div class="track" id="t3" onclick="toggle(3)">
  <div class="track-title">🎮 像素乐园</div>
  <div class="track-desc">复古电子 · 130 BPM · 8-bit 合成</div>
  <div class="ctrl">
    <button class="play-btn" id="pb3">▶</button>
    <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
  </div>
</div>

<div class="track" id="t4" onclick="toggle(4)">
  <div class="track-title">🍃 森林漫步</div>
  <div class="track-desc">清新自然 · 95 BPM · 长笛 + 自然音</div>
  <div class="ctrl">
    <button class="play-btn" id="pb4">▶</button>
    <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
  </div>
</div>

<footer>纯 Web Audio API 生成，无需加载任何文件</footer>

<script>
// 复用之前的 SoundFX 柔和风格引擎
let _ac = null;
function ac() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  return _ac;
}
function beep(freq, type, vol, dur, delay) {
  var a = ac(), o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime + (delay || 0));
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + (delay || 0) + dur);
  o.connect(g); g.connect(a.destination);
  o.start(a.currentTime + (delay || 0)); o.stop(a.currentTime + (delay || 0) + dur + 0.05);
}

// 精灵小镇：俏皮双音旋律 + 小军鼓节奏
var _t1 = null, _t1i = 0;
function playT1() {
  var mel = [523,784,659,784,523,659,784,1047,880,784,659,523,784,659,523,392,523,784,659,784,523,659,784,1047,880,784,659,523,784,659,523,392];
  var seq = [];
  for (var i = 0; i < mel.length; i++) seq.push({f:mel[i], t:0.1, d:0.1});
  var pos = 0, end = ac().currentTime + 20;
  function step() {
    if (ac().currentTime >= end) return;
    // 小军鼓
    beep(200,'triangle',0.05,0.04,0);
    // 旋律
    if (pos < seq.length) {
      beep(seq[pos].f,'sine',0.18,seq[pos].d,0.01);
      pos++;
    }
    _t1 = setTimeout(step, 110);
  }
  step();
}
function stopT1() { clearTimeout(_t1); _t1 = null; }

// 阳光咖啡馆：温暖钢琴琶音 + 和弦
var _t2 = null;
function playT2() {
  var bass = [261.6,329.6,392,440,523.3,587.3,659.3,523.3];
  var chd = [[261.6,329.6,392],[293.7,369.9,440.1],[329.6,392,493.9],[349.2,440,523.3],[392,493.9,587.3],[440,523.3,659.3],[392,493.9,587.3],[349.2,440,523.3]];
  var t = ac().currentTime;
  for (var i = 0; i < 20; i++) {
    var off = i * 0.5;
    // 和弦
    chd[i % chd.length].forEach(f => beep(f,'sine',0.04,0.4,off));
    // 低音
    beep(bass[i % bass.length],'triangle',0.06,0.3,off);
    // 钢琴高音点缀
    if (i % 2 === 0) beep(bass[(i+2)%bass.length]*2,'sine',0.03,0.15,off+0.05);
  }
  _t2 = setTimeout(playT2, 10000);
}
function stopT2() { clearTimeout(_t2); _t2 = null; }

// 像素乐园：方波8-bit
var _t3 = null;
function playT3() {
  var mel = [523,523,784,784,659,659,523,392,523,523,784,784,1047,880,784,523,392,523,523,784,784,659,659,523];
  var pos = 0, end = ac().currentTime + 20;
  function step() {
    if (ac().currentTime >= end) return;
    if (pos < mel.length) {
      beep(mel[pos],'square',0.08,0.08,0);
      pos++;
    }
    _t3 = setTimeout(step, 90);
  }
  step();
}
function stopT3() { clearTimeout(_t3); _t3 = null; }

// 森林漫步：长笛音色 + 自然节奏
var _t4 = null;
function playT4() {
  var notes = [392,440,523.3,587.3,659.3,587.3,523.3,440,392,329.6,392,440,523.3,523.3,587.3,523.3,440,392,329.6,261.6];
  for (var i = 0; i < notes.length; i++) {
    var off = i * 0.35;
    beep(notes[i],'sine',0.15,0.28,off);
    beep(notes[i]*2,'sine',0.02,0.15,off+0.05);
  }
  _t4 = setTimeout(playT4, 7000);
}
function stopT4() { clearTimeout(_t4); _t4 = null; }

var cur = null;
function toggle(n) {
  if (cur === n) {
    // stop
    if (n===1) stopT1(); if (n===2) stopT2(); if (n===3) stopT3(); if (n===4) stopT4();
    document.getElementById('t'+n).classList.remove('playing');
    document.getElementById('pb'+n).textContent = '▶';
    cur = null;
  } else {
    // 停旧的
    if (cur) { if (cur===1) stopT1(); if (cur===2) stopT2(); if (cur===3) stopT3(); if (cur===4) stopT4(); document.getElementById('t'+cur).classList.remove('playing'); document.getElementById('pb'+cur).textContent = '▶'; }
    // 播新的
    if (n===1) playT1(); if (n===2) playT2(); if (n===3) playT3(); if (n===4) playT4();
    document.getElementById('t'+n).classList.add('playing');
    document.getElementById('pb'+n).textContent = '⏸';
    cur = n;
  }
}
</script>
</body>
</html>
